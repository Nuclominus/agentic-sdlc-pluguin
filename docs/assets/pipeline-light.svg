<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-label="Pipeline: analyze, then build and review in a loop of up to three rounds, then security and tests in parallel, then a fix pass only on High or Critical findings, then QA verification, then a pull request" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#59636e"/></marker></defs>
  <rect x="0.5" y="0.5" width="959" height="239" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
  <rect x="16" y="92" width="110" height="56" rx="8" fill="#ffffff" stroke="#d1d9e0"/>
  <text x="71" y="117" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Analyze</text>
  <text x="71" y="135" text-anchor="middle" font-size="12" fill="#59636e">business-analyst</text>
  <line x1="130" y1="120" x2="144" y2="120" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="150" y="92" width="100" height="56" rx="8" fill="#ffffff" stroke="#d1d9e0"/>
  <text x="200" y="117" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Build</text>
  <text x="200" y="135" text-anchor="middle" font-size="12" fill="#59636e">developer</text>
  <text x="263" y="126" text-anchor="middle" font-size="18" font-weight="600" fill="#1a7f37">⇄</text>
  <rect x="276" y="92" width="100" height="56" rx="8" fill="#ffffff" stroke="#d1d9e0"/>
  <text x="326" y="117" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Review</text>
  <text x="326" y="135" text-anchor="middle" font-size="12" fill="#59636e">reviewer</text>
  <text x="263" y="172" text-anchor="middle" font-size="11" fill="#1a7f37">up to 3 rounds</text>
  <line x1="380" y1="120" x2="394" y2="120" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="400" y="40" width="148" height="160" rx="10" fill="none" stroke="#8c959f" stroke-dasharray="5 4"/>
  <rect x="410" y="52" width="128" height="52" rx="8" fill="#ffffff" stroke="#d4a72c"/>
  <text x="474" y="75" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Secure</text>
  <text x="474" y="93" text-anchor="middle" font-size="12" fill="#59636e">security-analyst</text>
  <rect x="410" y="112" width="128" height="52" rx="8" fill="#ffffff" stroke="#d1d9e0"/>
  <text x="474" y="135" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Test</text>
  <text x="474" y="153" text-anchor="middle" font-size="12" fill="#59636e">tester</text>
  <text x="474" y="186" text-anchor="middle" font-size="11" fill="#59636e">in parallel</text>
  <line x1="552" y1="120" x2="566" y2="120" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="572" y="92" width="100" height="56" rx="8" fill="#ffffff" stroke="#8c959f" stroke-dasharray="5 4"/>
  <text x="622" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Fix</text>
  <text x="622" y="128" text-anchor="middle" font-size="12" fill="#59636e">developer</text>
  <text x="622" y="142" text-anchor="middle" font-size="11" fill="#59636e">only if High+</text>
  <line x1="676" y1="120" x2="690" y2="120" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="696" y="92" width="110" height="56" rx="8" fill="#ffffff" stroke="#d1d9e0"/>
  <text x="751" y="117" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Verify</text>
  <text x="751" y="135" text-anchor="middle" font-size="12" fill="#59636e">qa-engineer</text>
  <line x1="810" y1="120" x2="824" y2="120" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="830" y="92" width="114" height="56" rx="8" fill="#0b1220" stroke="#0b1220"/>
  <text x="887" y="117" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f7fa">Ship</text>
  <text x="887" y="135" text-anchor="middle" font-size="12" fill="#3ddc84">pull request</text>
</svg>
