schema_version: "1.0"
name: 10-brief-dry-run
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /sdlc:start --brief=fixture-brief.md --workflow=hotfix --dry-run
  max_turns: 12
  timeout_seconds: 300
  model: sonnet
  allowed_tools: [Skill, Read, "Bash(node:*)", "Bash(jq:*)"]
runs: 3
graders:
  - { type: tool_used, name: fired, tool: Skill, input_match: pipeline-orchestrator, arm: with-only }
  - { type: tool_used, name: no-agent-dispatch, tool: Agent, input_match: '"subagent_type":"sdlc:(?!pipeline-orchestrator)', min: 0, max: 0, arm: both }
  - { type: file_exists, name: no-workspace, path: "docs/plans/**", exists: false }
  - { type: regex, name: brief-line, target: last_message, pattern: 'slug actions-list-crash, narrative_language uk' }
  - { type: regex, name: hotfix, target: last_message, pattern: 'Workflow:\s*\**hotfix\b' }
