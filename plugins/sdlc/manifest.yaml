# Vanilla — SDLC manifest (kind: foundation). DORMANT / opt-in fallback profile.
# No longer auto-matches every project. In this Android-only marketplace the generic pipeline is
# muted by default so a non-Android project HALTs asking for a foundation rather than silently
# running generic agents. Revive it per project in either of two ways:
#   • create an empty  .sdlc-enable-vanilla  file in the project root (detect below), or
#   • pass  --stack=vanilla  to /sdlc:start (compatibility override, skips auto-detect).
# Kept intact — manifest + its 5 agents (plugins/sdlc/agents/) — as a reference profile / template
# for a future non-Android foundation. Loses to any foundation with higher priority when it matches.

kind: foundation
stack: vanilla
priority: 0

detect:
  all:
    - file_exists: .sdlc-enable-vanilla   # dormant: opt in by creating this file (was: any ["*"])

agents_per_phase:
  business_analysis: business-analyst
  development: developer
  qa: qa-engineer
  security: security-analyst
  documentation: document-writer

convention_skills: []
extra_phases: []
pre_phase_commands: []
phase_injections: {}               # base prompts in pipeline-orchestrator are used as-is

# vanilla pipeline assumes the project has its own test/lint scripts the user invokes manually
post_pipeline_checks: []
