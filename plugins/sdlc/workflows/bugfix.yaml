name: bugfix
description: Fix a known bug — skip business analysis, run development through documentation.
match:
  arguments_pattern: "\\bfix(es|ed)?\\b|\\bbug\\b|\\bissue\\b"
  loc_touched_max: 500
phases:
  - name: development
    heal:
      max_attempts: 2
  - name: qa
    heal:
      max_attempts: 2
  - name: security
    heal:
      max_attempts: 2
  - documentation
