name: analysis
description: >
  Assessment pipeline — business-analysis + security review that produce reports.
  No development phase and no PR are created. Note: the security phase runs the
  security-analyst, which may still apply Critical/High fixes directly per its spec —
  so this is "no new feature work", not a guaranteed read-only run. Use to audit,
  assess, or analyze an area before deciding what (if anything) to build.
match:
  arguments_pattern: "\\banaly[sz]e\\b|\\baudit\\b|\\bassess(ment)?\\b"
caps:
  max_total_cost_usd: 0.30
phases:
  - business_analysis
  - name: security
    heal:
      max_attempts: 2
