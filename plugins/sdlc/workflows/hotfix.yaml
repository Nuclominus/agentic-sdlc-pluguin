name: hotfix
description: Emergency production fix — skip BA, minimal footprint, capped cost.
match:
  arguments_pattern: "\\bhotfix\\b|\\burgent\\b|\\bemergency\\b|\\bprod(uction)?\\s+fix\\b"
  loc_touched_max: 200
caps:
  # Sized from MEASURED transcript cost (see analysis.yaml for the method). The old $1.10 came from
  # the Step 1d-1 estimate before it was recalibrated, and sat below this recipe's measured MEDIAN
  # run.
  #
  # Basis: 56 transcript-priced phases across 10 real runs. Per-phase p90 —
  #   development $5.41, qa $1.48, security $0.40, documentation $0.21  =>  base_p90 = $7.50
  # Cap = base_p90 * 1.2 = $9.00.
  #
  # The 20% is headroom for healing and variance, NOT a measurement — no heal attempt has ever
  # fired in the data, so heal cost is unmeasured (same caveat as analysis.yaml).
  #
  # $9.00 looks high for an "emergency, minimal footprint" recipe, and that tension is real: the
  # measured p90 for `development` alone is $5.41. The cap's job is to stop a runaway, not to
  # express an aspiration — a cap set below the median run is not a budget, it is a tripwire that
  # fires on every use and trains people to click through it. If hotfix should genuinely cost less,
  # constrain the WORK (fewer phases, cheaper tiers via .claude/model.local.json), and let the cap
  # follow the measurement.
  max_total_cost_usd: 9.00
phases:
  - name: development
    heal:
      max_attempts: 2
  - name: qa
    heal:
      max_attempts: 2
  - name: security
    heal:
      max_attempts: 2
  - documentation
