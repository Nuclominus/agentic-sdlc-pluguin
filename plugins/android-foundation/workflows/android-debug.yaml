name: android-debug
description: >
  Android fix-and-verify pipeline that wires the on-demand android-debugger into the
  DAG: Debugger (root cause) -> Developer (fix) -> Reviewer (loops back to Developer,
  max 2) -> Tester. The `debugging` phase maps to android-debugger via the android
  foundation manifest's agents_per_phase. Note: on an Android project both `debug`
  and `android-debug` match the same arguments; `android-debug` sets `match.priority: 10`
  so it deterministically wins the auto-select tie-break over the generic `debug` recipe.
match:
  arguments_pattern: "\\bdebug\\b|\\bcrash\\b|\\bregression\\b|\\broot.?cause\\b"
  priority: 10
phases:
  - debugging
  - name: development
    heal:
      max_attempts: 2
  - name: review
    loop:
      return_to: development
      max_rounds: 2
  - name: test
    heal:
      max_attempts: 2
