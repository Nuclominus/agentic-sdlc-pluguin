name: android-feature
description: >
  Android native feature pipeline (rich roster):
  BA -> Developer -> Reviewer (loops back to Developer, max 3) -> [Security || Tester] -> QA -> DocsWriter.
  Loop + parallel are generic orchestrator control flow; the android profile supplies the agents per phase.
phases:
  - business_analysis
  - name: development
    heal:
      max_attempts: 2
  - name: review
    loop:
      return_to: development
      max_rounds: 3
  - parallel: [security, test]
  - name: qa
    heal:
      max_attempts: 2
  - documentation
