name: CI
on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install sdlc-lint deps
        run: npm ci --prefix tools/sdlc-lint
      - name: sdlc-lint all
        run: node tools/sdlc-lint/cli.mjs all --json
      - name: sdlc-lint unit tests
        run: npm test --prefix tools/sdlc-lint
      # ADR-0021 moved the Android expertise out of eleven agent bodies. A paragraph that fails
      # to land in its destination raises no error — it just stops existing — so the track note
      # carries a row per agent section and this asserts each row's anchor is really there.
      - name: expertise coverage (ADR-0021)
        run: node tools/sdlc-lint/scripts/expertise-coverage.mjs
      # The vault is the repo's SSOT (.claude/rules/second-brain.md), so its structure,
      # links and index completeness are a build concern. Without this the check only ran
      # when someone remembered to — which is how two ADRs shipped unlisted.
      - name: brain-sync vault check
        run: node tools/brain-sync/cli.mjs check --vault .brain
      - name: brain-sync unit tests
        run: node --test tools/brain-sync/test/*.test.mjs
      - name: AAR reference integrity
        run: |
          # planning docs under docs/superpowers/ and historical change notes under .brain/
          # legitimately retain the old skill reference as part of their narrative
          if grep -rn "android-workflow:aar" --include='*.md' --include='*.yaml' --exclude-dir=superpowers --exclude-dir=.brain .; then
            echo "::error::dangling android-workflow:aar reference — repoint to sdlc:aar"
            exit 1
          fi
          for f in SKILL gather report apply; do
            test -f "plugins/sdlc/skills/aar/$f.md" || { echo "::error::missing plugins/sdlc/skills/aar/$f.md"; exit 1; }
          done
          test -f plugins/sdlc/agents/aar-analyst.md
          test -f plugins/sdlc/commands/aar.md
          test -f plugins/sdlc/tools/aar/metrics.mjs
      - name: shellcheck hooks
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          find plugins -type f -name '*.sh' -path '*/hooks/*' -print0 | xargs -0 -r shellcheck
      - name: enforce-agent-model test
        run: bash tests/test-enforce-agent-model.sh
      - name: model-local schema test
        run: python3 tests/test-model-local-schema.py
